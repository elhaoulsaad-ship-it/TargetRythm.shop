<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMU STYLE - Commande Express</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.321.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #ee3848;
            --whatsapp: #25D366;
            --whatsapp-hover: #20ba5a;
            --dark: #1e2229;
            --text-gray: #747d8c;
            --light-bg: #f5f6fa;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --hover-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark);
            overflow-x: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseBadge {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        header {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .logo {
            font-weight: 900;
            font-size: 24px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary), #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cart-icon-container {
            position: relative;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            background: #f1f2f6;
            transition: all 0.3s ease;
        }

        .cart-icon-container:hover {
            transform: scale(1.1);
            background: #e4e7eb;
        }

        .cart-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid white;
            transition: all 0.2s ease;
        }

        .hero {
            background: linear-gradient(135deg, #1e2229, #2f3542);
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .shipping-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 71, 87, 0.15);
            color: #ff6b81;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            animation: pulseBadge 2s infinite ease-in-out;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .product-card:hover {
            box-shadow: var(--hover-shadow);
        }

        .product-image-box {
            width: 100%;
            height: 400px;
            overflow: hidden;
            background-color: #f1f2f6;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 25px;
        }

        .product-title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 28px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .product-price span {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-gray);
            text-decoration: line-through;
        }

        .add-to-cart-btn {
            background-color: var(--dark);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .add-to-cart-btn:hover {
            background-color: var(--primary);
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.3);
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 440px;
            height: 100%;
            background: white;
            box-shadow: -10px 0 40px rgba(0,0,0,0.12);
            z-index: 200;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 25px;
            border-bottom: 1px solid #f1f2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-size: 20px;
            font-weight: 700;
        }

        .close-cart {
            cursor: pointer;
            background: #f1f2f6;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-items {
            padding: 25px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #f1f2f6;
        }

        .cart-item-details h4 {
            font-size: 15px;
            font-weight: 600;
        }

        .cart-item-details span {
            color: var(--primary);
            font-weight: 700;
        }

        .remove-item {
            color: #ff4757;
            cursor: pointer;
            background: none;
            border: none;
            padding: 8px;
        }

        .cart-footer {
            padding: 25px;
            border-top: 1px solid #f1f2f6;
            background: #fbfbfc;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .checkout-btn {
            background-color: var(--whatsapp);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .checkout-btn:hover {
            background-color: var(--whatsapp-hover);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TEMU STYLE</div>
        <div class="cart-icon-container" onclick="toggleCart(true)">
            <i data-lucide="shopping-bag" style="width: 24px; height: 24px;"></i>
            <span class="cart-count" id="cart-count">0</span>
        </div>
    </header>

    <div class="hero">
        <div class="shipping-badge">
            <i data-lucide="truck" style="width: 16px; height: 16px;"></i> Livraison Gratuite Partout au Maroc
        </div>
        <h1>Offre Exclusive ✨</h1>
    </div>

    <div class="container">
        <!-- Produit Unique -->
        <div class="product-card">
            <div class="product-image-box">
                <img class="product-img" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjmdYaHbmiCRjuJB5oAODvf-k-YCfrRqIe66LVQex-RDnzCgrynSuo_AsPfL6z9Zwc64qcaigrMEgx1y7H4kgXLyKLfrjqw5wI6fq4V6j-mN_gA3d1h4PmtLb1HYFNqlJH04OXtfkjZdr7bWcfPDwa9dnVXX9oH_JCDRCap_-3QdVV-027lljJ4ix7Zg0Hv/s1286/IMG_1222.jpeg" alt="Ventilateur de Poche LED">
            </div>
            <div class="product-info">
                <h3 class="product-title">Ventilateur de Poche Rechargeable avec Support & Affichage LED Intelligent</h3>
                <div class="product-price">159 DH <span>249 DH</span></div>
                <button class="add-to-cart-btn" onclick="addToCart('Ventilateur Poche LED Premium', 159)">
                    <i data-lucide="shopping-cart" style="width: 18px; height: 18px;"></i> Ajouter au Panier
                </button>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart(false)"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>Mon Panier</h3>
            <button class="close-cart" onclick="toggleCart(false)">
                <i data-lucide="x" style="width: 18px; height: 18px;"></i>
            </button>
        </div>
        
        <div class="cart-items" id="cart-items-container"></div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total :</span>
                <span id="cart-total-price">0 DH</span>
            </div>
            <button class="checkout-btn" onclick="sendToWhatsApp()">
                <i data-lucide="message-square" style="width: 20px; height: 20px;"></i> Commander via WhatsApp
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let cart = [];
        const whatsappNumber = "212665290743";

        function toggleCart(open) {
            const drawer = document.getElementById('cart-drawer');
            const overlay = document.getElementById('overlay');
            if (open) {
                drawer.classList.add('open');
                overlay.classList.add('open');
            } else {
                drawer.classList.remove('open');
                overlay.classList.remove('open');
            }
        }

        function addToCart(name, price) {
            const existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1 });
            }
            updateCartUI();
            toggleCart(true);
        }

        function removeFromCart(name) {
            cart = cart.filter(item => item.name !== name);
            updateCartUI();
        }

        function updateCartUI() {
            const itemsContainer = document.getElementById('cart-items-container');
            const countSpan = document.getElementById('cart-count');
            const totalSpan = document.getElementById('cart-total-price');
            
            itemsContainer.innerHTML = '';
            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                itemsContainer.innerHTML = `
                    <div style="text-align:center; color:var(--text-gray); margin-top:50px;">
                        <i data-lucide="shopping-bag" style="width: 48px; height: 48px; margin-bottom:12px; stroke: #ccc;"></i>
                        <p>Votre panier est vide.</p>
                    </div>
                `;
            }

            cart.forEach(item => {
                total += item.price * item.quantity;
                totalItems += item.quantity;

                const itemElement = document.createElement('div');
                itemElement.classList.add('cart-item');
                itemElement.innerHTML = `
                    <div class="cart-item-details">
                        <h4>${item.name}</h4>
                        <small style="color: var(--text-gray)">Quantité : ${item.quantity}</small><br>
                        <span>${item.price * item.quantity} DH</span>
                    </div>
                    <button class="remove-item" onclick="removeFromCart('${item.name}')">
                        <i data-lucide="trash-2" style="width:18px; height:18px;"></i>
                    </button>
                `;
                itemsContainer.appendChild(itemElement);
            });

            countSpan.innerText = totalItems;
            totalSpan.innerText = total + " DH";
            lucide.createIcons();
        }

        function sendToWhatsApp() {
            if (cart.length === 0) return;

            let message = "⚡ *NOUVELLE COMMANDE - VENTILATEUR LED*\n";
            message += "=========================\n\n";
            let total = 0;

            cart.forEach((item) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                message += `📦 *${item.name}*\n`;
                message += `   • Quantité : ${item.quantity}\n`;
                message += `   • Prix : ${subtotal} DH\n\n`;
            });

            message += "=========================\n";
            message += `💰 *TOTAL A PAYER : ${total} DH*\n`;
            message += "🚚 *Livraison : Gratuite (COD)*\n\n";
            message += "Voici mes informations de livraison :\n";
            message += "• *Nom Complet :*\n";
            message += "• *Ville :*\n";
            message += "• *Adresse :*";

            window.open(`https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(message)}`, '_blank');
        }

        updateCartUI();
    </script>
</body>
</html>
