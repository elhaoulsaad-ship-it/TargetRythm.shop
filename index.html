<!DOCTYPE html>
<html lang="en">
<head>

    <title>Remote Career Opportunity | USA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {

            box-shadow: 0 10px 25px rgba(0,0,0,0.1);

            margin-bottom: 25px;

            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;

        .btn:hover {

            transform: scale(1.02);
